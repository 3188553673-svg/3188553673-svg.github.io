name: Package Afterclass Arena v3.0
on:
  push:
    branches: [afterclass-host-kit-v3.0]
permissions:
  contents: write
jobs:
  package:
    if: "${{ contains(github.event.head_commit.message, 'Assemble approved host kit') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and verify the tested archive
        run: |
          cp afterclass-arena/v2.3/afterclass-arena-lan-v2.3.zip host.zip
          git apply --binary host-v30.patch
          echo "ddf98716e153e1c3a58c17a69021d4221b8431228fd3e9c7d07cc42952e19f5b  host.zip" | sha256sum -c -
          unzip -tq host.zip
          mkdir -p afterclass-arena/v3.0
          mv host.zip afterclass-arena/v3.0/afterclass-arena-lan-v3.0.zip
          git add -- afterclass-arena/v3.0/afterclass-arena-lan-v3.0.zip
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m 'Build verified Afterclass Arena v3.0 host kit'
          git push origin HEAD:refs/heads/afterclass-host-kit-v3.0
