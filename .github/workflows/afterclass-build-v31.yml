name: Package Afterclass Arena v3.1
on:
  push:
    branches: [afterclass-host-kit-v3.1]
permissions:
  contents: write
jobs:
  package:
    if: "${{ contains(github.event.head_commit.message, 'Assemble approved host kit') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and verify the tested archive
        run: |
          cp afterclass-arena/v3.0/afterclass-arena-lan-v3.0.zip host.zip
          git apply --binary host-v31.patch
          echo "58fd7bcaa09cfe593a6db53ee7dc5b708d1de71eecd605145b352ee2e3dcbb1e  host.zip" | sha256sum -c -
          unzip -tq host.zip
          mkdir -p afterclass-arena/v3.1
          mv host.zip afterclass-arena/v3.1/afterclass-arena-lan-v3.1.zip
          git add -- afterclass-arena/v3.1/afterclass-arena-lan-v3.1.zip
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m 'Build verified Afterclass Arena v3.1 host kit'
          git push origin HEAD:refs/heads/afterclass-host-kit-v3.1
