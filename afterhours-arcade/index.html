<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#201c24"><title>放学后禁止加练 · 课后街机厅</title>
<link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css">
</head>
<body>
<header class="mast"><div class="mast-inner"><div class="brand"><i data-icon="arcade"></i><div><strong>课后街机厅</strong><small>AFTER HOURS ARCADE</small></div></div>
<div class="mast-actions"><button id="help" class="top-btn"><i data-icon="pad"></i><span>操作手册</span></button><button id="sound" class="top-btn square" aria-label="关闭声音"><i data-icon="speaker"></i></button></div></div></header>
<main id="home">
<section class="keyart" aria-label="放学后禁止加练"><div class="cover-copy"><div class="overline"><b></b> 像素动作 · 合作闯关</div><h1><span>放学后</span><strong>禁止加练</strong></h1><p>带上你的队友，打响最后一声放学铃。</p></div><span class="cover-code" aria-hidden="true">AFTER HOURS <b>✦</b></span></section>
<div class="setup">
<section class="roster-section"><div class="section-head"><div class="heading-pair"><i data-icon="crew"></i><h2>选择角色</h2></div><div id="seat-tabs" class="seat-tabs" hidden></div></div>
<div class="roster" id="roster" aria-label="可选角色"></div>
<div class="skill-info"><i data-icon="spark"></i><div><strong id="skill-name"></strong><span id="skill-detail"></span></div></div></section>
<section class="setup-panel" aria-label="开始游戏"><div class="section-head"><div class="heading-pair"><i data-icon="pad"></i><h2>出击设置</h2></div></div>
<div class="mode-row" id="modes"></div><div id="mode-detail" class="mode-detail"></div>
<div id="local-seats" hidden><label for="seat-count">这台设备的人数</label><select id="seat-count"><option value="1">1 人</option><option value="2">2 人</option></select></div>
<button class="launch" id="launch"><span>开始闯关</span><i data-icon="go"></i></button><button id="join-link" class="under" hidden>输入邀请码加入</button></section>
</div>
<section class="boss-strip"><div class="boss-label"><i data-icon="skull"></i><strong>本次挑战</strong></div><div><em>01</em> 钢胆侠 <span>直播擂台</span></div><i class="route-line"></i><div><em>02</em> 跑早操的灭霸 <span>田径跑道</span></div></section>
</main>
<main id="lobby" hidden><section class="lobby-box"><div class="section-head"><div class="heading-pair"><i data-icon="wifi"></i><h2>局域网房间</h2></div><button class="small-btn" id="leave-room">离开房间</button></div><div class="lobby-body"><div><p class="cap">房间码</p><div class="room-code" id="room-code"></div><p class="small-copy">同一 Wi-Fi 下，朋友可扫码或打开邀请链接。</p><input readonly id="share-url" aria-label="邀请链接"><button class="small-btn" id="copy-room">复制邀请链接</button></div><img id="qr" alt="房间邀请二维码"></div><div class="room-members" id="room-members"></div><button class="launch" id="start-room"></button></section></main>
<main id="battle" hidden><section class="arena">
<div class="scoreboard"><div class="stage-left"><i data-icon="flag"></i><div><small id="stage-count"></small><strong id="stage-name"></strong></div></div><div class="hud-actions"><span id="score"></span><button id="pause" class="small-btn"></button></div></div>
<div class="view"><canvas id="world" width="960" height="540" aria-label="俯视角合作闯关战场"></canvas><div class="stage-flash" id="stage-flash" hidden></div></div>
<div class="status-row"><div id="vitals"></div><div id="objective"></div></div>
</section><div class="play-keys" id="play-keys"></div>
<div class="touch" id="touch"><div class="stick" id="stick" aria-label="移动摇杆"><b></b></div><div class="touch-actions"><button data-act="swap" aria-label="切换武器">换</button><button data-act="dash">闪</button><button data-act="skill">技</button><button data-act="attack">击</button></div></div></main>
<dialog id="modal"><div class="dialog-head"><h2 id="modal-title"></h2><button id="modal-close" class="square small-btn" aria-label="关闭">×</button></div><div id="modal-body"></div></dialog>
<div id="note" role="status" aria-live="polite"></div>
<script type="module" src="app.mjs"></script>
</body></html>
